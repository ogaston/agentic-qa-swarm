name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      services: ${{ steps.list.outputs.services }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: list
        run: echo "services=$(bash scripts/ci/list-services.sh)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Construir imagen
        env:
          SERVICE: ${{ matrix.service }}
        run: docker build -t "ci-build:${GITHUB_SHA}" "${SERVICE}"

  test:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: hashFiles(format('{0}/go.mod', matrix.service)) != ''
        with:
          go-version-file: ${{ matrix.service }}/go.mod
      - name: Pruebas Go
        if: hashFiles(format('{0}/go.mod', matrix.service)) != ''
        working-directory: ${{ matrix.service }}
        run: go test ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: hashFiles(format('{0}/pyproject.toml', matrix.service)) != ''
      - name: Pruebas Python
        if: hashFiles(format('{0}/pyproject.toml', matrix.service)) != ''
        working-directory: ${{ matrix.service }}
        run: |
          pip install -e '.[test]'
          python -m pytest

  vuln:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        if: hashFiles(format('{0}/go.mod', matrix.service)) != ''
        with:
          go-version-file: ${{ matrix.service }}/go.mod
      - name: govulncheck
        if: hashFiles(format('{0}/go.mod', matrix.service)) != ''
        working-directory: ${{ matrix.service }}
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: hashFiles(format('{0}/pyproject.toml', matrix.service)) != ''
      - name: pip-audit
        if: hashFiles(format('{0}/pyproject.toml', matrix.service)) != ''
        working-directory: ${{ matrix.service }}
        run: |
          pip install pip-audit==2.7.3
          pip-audit .

  sbom:
    needs: discover
    if: needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Nombre de artefacto
        id: n
        env:
          SERVICE: ${{ matrix.service }}
        run: echo "name=sbom-$(echo "${SERVICE}" | tr '/' '-')" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@006b7ce8314066bdf1765b4500370d40fa6917a3 # v0.24.2
        with:
          path: ${{ matrix.service }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.n.outputs.name }}
          path: sbom.spdx.json

  publish:
    needs: [discover, build, test, vuln, sbom]
    if: startsWith(github.ref, 'refs/tags/v') && needs.discover.outputs.services != '[]'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.discover.outputs.services) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calcular imagen
        id: img
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          owner=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/$(basename "${SERVICE}")" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.img.outputs.name }}:${{ github.ref_name }}
            ${{ steps.img.outputs.name }}:${{ github.sha }}

  no-latest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: bash scripts/ci/check-no-latest.sh deploy/flux/prod
