name: policies

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: policies-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  policies:
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Politicas y validacion de manifiestos
        run: bash scripts/ci/policies.sh
