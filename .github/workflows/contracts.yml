name: contracts
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validar contratos (esquemas y ejemplos de eventos)
        run: bash contracts/validate.sh
      - name: Lint OpenAPI del control plane
        run: npx --yes @redocly/cli@1.25.0 lint contracts/openapi/control-plane.yaml
