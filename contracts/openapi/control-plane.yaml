openapi: 3.1.0
info:
  title: Agentic QA Swarm - Control Plane API
  version: 1.0.0
  description: Contrato REST sincrono del control plane (forma solamente, sin logica).
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: https://control-plane.example
security:
  - bearerAuth: []
paths:
  /webhooks/github:
    post:
      operationId: handleGithubWebhook
      summary: Recibe un evento de GitHub (firmado) y crea una notificacion.
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: true
          schema: {type: string}
        - name: X-GitHub-Event
          in: header
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: true}
      responses:
        '202':
          description: Notificacion creada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Notification'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /notifications:
    get:
      operationId: listNotifications
      summary: Inbox de notificaciones.
      parameters:
        - name: state
          in: query
          schema: {type: string, enum: [pending, confirmed, rejected]}
      responses:
        '200':
          description: Lista de notificaciones.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/Notification'}
        '401': {$ref: '#/components/responses/Error'}
  /notifications/{id}/confirm:
    post:
      operationId: confirmRun
      summary: Confirma una notificacion (persiste confirmacion auditable).
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flows]
              properties:
                flows:
                  type: array
                  minItems: 1
                  items: {type: string}
      responses:
        '201':
          description: Confirmacion registrada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfirmationReceipt'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /warm:
    get:
      operationId: getWarmState
      summary: Estado del warm (solo lectura). ui-api lo lee con el token de servicio; el token de la persona no sale de ui-api.
      responses:
        '200':
          description: Estado del warm.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WarmState'}
        '401': {$ref: '#/components/responses/Error'}
        '503':
          description: Warm no disponible (sin configurar, respuesta invalida, caido, 401/5xx del warm o circuito abierto). Incluye Retry-After.
          headers:
            Retry-After:
              schema: {type: integer}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Error'}
  /confirmations:
    get:
      operationId: listConfirmations
      summary: Recibos de confirmacion, mas reciente primero. Un user ve solo los suyos (confirmed_by); un admin ve todos.
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: Lista de recibos.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/ConfirmationReceipt'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
  /runs/{id}:
    get:
      operationId: getRun
      summary: Estado de una corrida.
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Corrida.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Run'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /reports/{run}:
    get:
      operationId: getReport
      summary: Reporte post-mortem de una corrida.
      parameters:
        - {name: run, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Reporte.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Report'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /policies/{name}:
    get:
      operationId: getPolicy
      summary: Lee la ultima version de una politica (cualquier autenticado; 404 si nunca se escribio).
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Politica vigente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Policy'}
        '401': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    put:
      operationId: setPolicy
      summary: Define una politica (solo admin).
      parameters:
        - {name: name, in: path, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Policy'}
      responses:
        '200':
          description: Politica versionada.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PolicyVersion'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /gates/authorize:
    post:
      operationId: authorizeGate
      summary: Evalua los gates de una transicion de corrida (fail-closed; solo servicio a servicio).
      security:
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GateRequest'}
      responses:
        '200':
          description: Decision (allow=false tambien es 200).
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateDecision'}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '413': {$ref: '#/components/responses/Error'}
        '503':
          description: Error interno o auditoria imposible; siempre allow=false.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/GateDecision'}
  /audit:
    get:
      operationId: queryAudit
      summary: Consulta del registro de auditoria.
      parameters:
        - {name: run, in: query, schema: {type: string}}
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 500}}
      responses:
        '200':
          description: Entradas de auditoria.
          content:
            application/json:
              schema:
                type: array
                items: {$ref: '#/components/schemas/AuditEntry'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /auth/login:
    post:
      operationId: login
      summary: Inicia sesion.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: {type: string}
                password: {type: string, format: password}
                otp: {type: string, pattern: '^[0-9]{6}$'}
      responses:
        '200':
          description: Sesion iniciada.
          content:
            application/json:
              schema:
                type: object
                required: [token, expires_at]
                properties:
                  token: {type: string}
                  expires_at: {type: string, format: date-time}
                  session_id: {type: string}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /auth/logout:
    post:
      operationId: logout
      summary: Cierra la sesion.
      responses:
        '204':
          description: Sesion cerrada.
        '401': {$ref: '#/components/responses/Error'}
  /auth/session:
    get:
      operationId: getSession
      summary: Sesion del token presentado (cuenta como uso para la inactividad).
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sesion vigente.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Error'}
  /auth/sessions/{id}:
    get:
      operationId: getSessionById
      summary: Sesion por id publico. Un user solo ve la suya (403 si es ajena o no existe); un admin ve 404 si no existe.
      security:
        - bearerAuth: []
      parameters:
        - {name: id, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Sesion.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Session'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /auth/users:
    get:
      operationId: listUsers
      summary: Lista usuarios (solo admin). Nunca expone hashes ni secretos.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Usuarios.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [username, role]
                  properties:
                    username: {type: string}
                    role: {type: string, enum: [user, admin]}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    serviceToken:
      type: http
      scheme: bearer
      description: Token de servicio a servicio (GOVERNANCE_SERVICE_TOKEN), distinto de los tokens de personas.
  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: {type: string}
        message: {type: string}
    Session:
      type: object
      required: [principal_id, role, session_id, expires_at]
      properties:
        principal_id: {type: string}
        role: {type: string, enum: [user, admin]}
        session_id: {type: string}
        expires_at: {type: string, format: date-time}
    Notification:
      type: object
      required: [id, github_event, repo, sha, state]
      properties:
        id: {type: string}
        github_event: {type: string, enum: [commit, pull_request, tag]}
        repo: {type: string}
        sha: {type: string}
        artifact:
          type: object
          required: [kind, ref]
          properties:
            kind: {type: string, enum: [build-from-repo, published-image]}
            ref: {type: string, minLength: 1}
          additionalProperties: false
        state: {type: string, enum: [pending, confirmed, rejected]}
    WarmState:
      type: object
      required: [warm_id, state, reset_verified, baseline_version]
      additionalProperties: false
      properties:
        warm_id: {type: string, minLength: 1}
        state: {type: string, enum: [ready, dirty, cuarentena, idle-escalado]}
        reset_verified: {type: boolean}
        baseline_version: {type: string, minLength: 1}
    ConfirmationReceipt:
      type: object
      required: [run_id, notification_id, confirmed_by, confirmed_at]
      properties:
        run_id: {type: string}
        notification_id: {type: string}
        confirmed_by: {type: string}
        confirmed_at: {type: string, format: date-time}
    Run:
      type: object
      required: [id, state]
      properties:
        id: {type: string}
        state:
          type: string
          enum: [confirmed, warm_ready, deploying, inferring, rehearsing, running, resetting, reporting, done, failed]
        trace_id: {type: string}
    Report:
      type: object
      required: [run_id, findings]
      properties:
        run_id: {type: string}
        findings:
          type: array
          items:
            type: object
            required: [id, severity, summary]
            properties:
              id: {type: string}
              severity: {type: string, enum: [low, medium, high, critical]}
              summary: {type: string}
    Policy:
      type: object
      required: [value]
      properties:
        value: {type: object, additionalProperties: true}
    PolicyVersion:
      type: object
      required: [name, version]
      properties:
        name: {type: string}
        version: {type: integer}
    GateDecision:
      type: object
      required: [allow, reason, audit_ref]
      properties:
        allow: {type: boolean}
        reason: {type: string}
        audit_ref: {type: string}
    GateRequest:
      type: object
      required: [run_id, from, to, target_namespace]
      properties:
        run_id: {type: string}
        from: {type: string}
        to: {type: string}
        target_namespace: {type: string}
        workflow: {type: string}
        confirmed: {type: string, enum: ['true', 'false', unknown]}
        reset_verified: {type: string, enum: ['true', 'false', unknown]}
        ensayo_passed: {type: string, enum: ['true', 'false', unknown]}
        workflow_allowed: {type: string, enum: ['true', 'false', unknown]}
        approval_recorded: {type: string, enum: ['true', 'false', unknown]}
    AuditEntry:
      type: object
      required: [at, actor, action]
      properties:
        at: {type: string, format: date-time}
        actor: {type: string}
        action: {type: string}
        run_id: {type: string}
