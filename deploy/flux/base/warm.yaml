apiVersion: v1
kind: ConfigMap
metadata:
  name: warm-policy
  namespace: aqs-test
data:
  idleScaleDownAfter: 30m
  minReplicasIdle: "0"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warm-app
  namespace: aqs-test
  labels:
    app.kubernetes.io/name: warm-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warm-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warm-app
    spec:
      containers:
        - name: warm-app
          # TZ=UTC: variable inocua; existe para que image no sea la primera clave y el grep de CA-7 (^\s+image:) cuente todos los contenedores. Ver bitacoras/U5-T04.md F-03.
          env:
            - name: TZ
              value: UTC
          image: nginx:1.27.2
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: warm-app
  namespace: aqs-test
spec:
  selector:
    app.kubernetes.io/name: warm-app
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: warm-db
  namespace: aqs-test
  labels:
    app.kubernetes.io/name: warm-db
spec:
  serviceName: warm-db
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warm-db
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warm-db
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          ports:
            - name: pg
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: warm-db-credentials
                  key: password
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: warm-db
  namespace: aqs-test
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: warm-db
  ports:
    - name: pg
      port: 5432
      targetPort: pg
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: warm-redis
  namespace: aqs-test
  labels:
    app.kubernetes.io/name: warm-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: warm-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: warm-redis
    spec:
      containers:
        - name: redis
          # TZ=UTC: variable inocua; existe para que image no sea la primera clave y el grep de CA-7 (^\s+image:) cuente todos los contenedores. Ver bitacoras/U5-T04.md F-03.
          env:
            - name: TZ
              value: UTC
          image: redis:7.4.1
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            tcpSocket:
              port: redis
          livenessProbe:
            tcpSocket:
              port: redis
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: warm-redis
  namespace: aqs-test
spec:
  selector:
    app.kubernetes.io/name: warm-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: housekeeping
  namespace: aqs-system
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  # Un Job Pending (podAffinity sin pod go-reset) no debe bloquear los siguientes con Forbid.
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: go-reset
          securityContext:
            fsGroup: 65532
          # El PVC go-reset-data es RWO: el Job va al mismo nodo que el pod de go-reset para compartir sesiones y outbox.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: go-reset
          containers:
            - name: housekeeping
              # TZ=UTC: variable inocua; existe para que image no sea la primera clave y el grep de CA-7 (^\s+image:) cuente todos los contenedores. Ver bitacoras/U5-T04.md F-03.
              env:
                - name: TZ
                  value: UTC
                - name: RESET_NAMESPACE
                  value: aqs-test
                - name: RESET_DATA_DIR
                  value: /data/sessions
                - name: RESET_OUTBOX_FILE
                  value: /data/outbox.jsonl
                - name: RESET_WARM_ID
                  value: warm-1
                - name: RESET_REDIS_ADDR
                  value: warm-redis.aqs-test.svc:6379
                - name: RESET_BASELINE_SCRIPT
                  value: /etc/aqs/baseline/baseline.sh
                - name: RESET_BASELINE_VERSION
                  value: v1
              image: ghcr.io/ogaston/agentic-qa-swarm/go-reset:0.0.0
              args: ["housekeeping"]
              securityContext:
                runAsNonRoot: true
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: data
                  mountPath: /data
                - name: baseline
                  mountPath: /etc/aqs/baseline
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 128Mi
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: go-reset-data
            - name: baseline
              configMap:
                name: go-reset-baseline
                defaultMode: 0555
            - name: tmp
              emptyDir: {}
---
# Domingo 03:30, desfasado de housekeeping (cada hora en :00) e idle-check (:x5): sin Lease aun, no hay exclusion entre procesos (candidata).
