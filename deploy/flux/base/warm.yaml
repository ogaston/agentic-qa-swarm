# Burst de una corrida: 1 ensayo (250m/128Mi) + 3 runners (500m/256Mi, RUN_MAX_PARALLEL_RUNNERS) = 4 Jobs; warm base = 3 pods + 2 de surge.
# limits: Jobs 1,75 CPU/896Mi + warm 1,75 CPU/1,1Gi = 3,5 CPU/2Gi -> 6 CPU/6Gi deja margen; requests 2 CPU/3Gi.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aqs-test-quota
  namespace: aqs-test
spec:
  hard:
    pods: "15"
    # Los Jobs de ensayo y runner no llevan ttlSecondsAfterFinished ni se limpian (candidata de codigo): la cuota cuenta Jobs retenidos.
    count/jobs.batch: "100"
    requests.cpu: "2"
    requests.memory: 3Gi
    limits.cpu: "6"
    limits.memory: 6Gi
---
# Ningun pod/Job entra sin limites: default y defaultRequest rellenan, max acota por contenedor.
apiVersion: v1
kind: LimitRange
metadata:
  name: aqs-test-limits
  namespace: aqs-test
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "1"
        memory: 1Gi
