spec:
  schedule: "5,15,25,35,45,55 * * * *"
  concurrencyPolicy: Forbid
  # Un Job Pending (podAffinity sin pod go-reset) no debe bloquear los siguientes con Forbid.
  startingDeadlineSeconds: 300
  jobTemplate:
    spec:
      activeDeadlineSeconds: 1800
      template:
        spec:
          restartPolicy: Never
