apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: aqs-test-operator
  namespace: aqs-test
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: aqs-test-operator
  namespace: aqs-test
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: aqs-test-operator
subjects:
  - kind: ServiceAccount
    name: go-run-controller
    namespace: aqs-system
  - kind: ServiceAccount
    name: go-warm-manager
    namespace: aqs-system
  - kind: ServiceAccount
    name: go-reset
    namespace: aqs-system
  - kind: ServiceAccount
    name: aqs-reset
    namespace: aqs-test
