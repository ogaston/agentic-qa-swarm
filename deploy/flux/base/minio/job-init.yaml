apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: minio-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: init
          image: amazon/aws-cli:2.18.0
          command: ["/bin/sh", "/scripts/init-bucket.sh"]
          env:
            - name: AQS_S3_ENDPOINT
              value: https://minio.aqs-system.svc:9000
            - name: AWS_CA_BUNDLE
              value: /etc/minio-ca/ca.crt
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-user
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: root-password
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: ca
              mountPath: /etc/minio-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
      volumes:
        - name: scripts
          configMap:
            name: minio-init-script
        - name: ca
          secret:
            secretName: minio-tls
            items:
              - key: ca.crt
                path: ca.crt
