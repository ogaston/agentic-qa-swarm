apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-api
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: ui-api
    aqs.io/tier: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui-api
        aqs.io/tier: control-plane
    spec:
      containers:
        - name: ui-api
          env:
            - name: TZ
              value: UTC
          image: ghcr.io/ogaston/agentic-qa-swarm/ui-api:0.0.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui-api
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: ui-api
spec:
  selector:
    app.kubernetes.io/name: ui-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
