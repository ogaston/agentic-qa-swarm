  annotations:
    aqs.io/audit-retention-days: "90"
spec:
  replicas: 1
  # PVC ReadWriteOnce con una replica: RollingUpdate dejaria dos pods compitiendo por el volumen.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: go-governance
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-governance
        aqs.io/tier: control-plane
    spec:
      serviceAccountName: go-governance
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      containers:
        - name: go-governance
          # TZ=UTC: variable inocua; existe para que image no sea la primera clave y el grep de CA-7 (^\s+image:) cuente todos los contenedores. Ver bitacoras/U5-T04.md F-03.
          env:
            - name: TZ
              value: UTC
            - name: GOVERNANCE_DATA_DIR
              value: /data
            - name: GOVERNANCE_AUDIT_RETENTION_DAYS
              value: "90"
            - name: GOVERNANCE_AUTH
