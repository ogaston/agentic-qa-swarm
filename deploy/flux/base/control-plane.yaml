# Secrets que un humano crea cifrados con SOPS (sin valores aqui; ns aqs-system): go-governance-service-token{token},
# go-warm-manager-service-token{token}, go-reset-service-token{token}, aqs-evidence-s3{access-key,secret-key}.
# ConfigMap que un humano aporta: go-reset-baseline{baseline.sh} (script de baseline de la app; contrato clean|verify|version).
# El Role aqs-test-operator es compartido por go-run-controller, go-warm-manager y go-reset (separarlo por servicio: candidata).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui-api
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: ui-api
    aqs.io/tier: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ui-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ui-api
        aqs.io/tier: control-plane
    spec:
      serviceAccountName: ui-api
      automountServiceAccountToken: false
      containers:
        - name: ui-api
          # TZ=UTC: variable inocua; existe para que image no sea la primera clave y el grep de CA-7 (^\s+image:) cuente todos los contenedores. Ver bitacoras/U5-T04.md F-03.
          env:
            - name: TZ
              value: UTC
          image: ghcr.io/ogaston/agentic-qa-swarm/ui-api:0.0.0
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: ui-api
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: ui-api
spec:
  selector:
    app.kubernetes.io/name: ui-api
  ports:
    - name: http
      port: 8080
      targetPort: http
