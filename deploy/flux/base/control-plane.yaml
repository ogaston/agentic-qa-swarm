# Auditoria append-only de go-governance. Retencion minima: 90 d (no se borra, rota ni compacta).
# Sin storageClassName: usa la clase por defecto del cluster (igual que U5-T07; pendiente C-17).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go-governance-data
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: go-governance
  annotations:
    aqs.io/audit-retention-days: "90"
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-identity
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: go-identity
    aqs.io/tier: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: go-identity
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-identity
        aqs.io/tier: control-plane
    spec:
      serviceAccountName: go-identity
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 65532
      containers:
        - name: go-identity
          # TZ=UTC: variable inocua; existe para que image no sea la primera clave y el grep de CA-7 (^\s+image:) cuente todos los contenedores. Ver bitacoras/U5-T04.md F-03.
          env:
            - name: TZ
              value: UTC
            - name: IDENTITY_USERS_FILE
              value: /etc/aqs/identity/users.json
            - name: IDENTITY_TRUST_PROXY
              value: "false"
          image: ghcr.io/ogaston/agentic-qa-swarm/go-identity:0.0.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          volumeMounts:
            - name: users
              mountPath: /etc/aqs/identity
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: users
          secret:
            secretName: go-identity-users
            defaultMode: 0440
            items:
              - key: users.json
                path: users.json
---
apiVersion: v1
kind: Service
metadata:
  name: go-identity
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: go-identity
spec:
  selector:
    app.kubernetes.io/name: go-identity
  ports:
    - name: http
      port: 8080
      targetPort: http
---
# maxReplicas: 1 a proposito: el diario del controlador vive en un PVC de un solo escritor; mas replicas romperian su
# integridad hasta resolver la persistencia compartida (C-45/C-49). Escalar = cambiar este numero despues de eso.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: go-run-controller
  namespace: aqs-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: go-run-controller
  minReplicas: 1
  maxReplicas: 1
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
