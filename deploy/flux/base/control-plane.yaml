apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-run-controller
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: go-run-controller
    aqs.io/tier: control-plane
spec:
  replicas: 1
  # PVC ReadWriteOnce con una replica: RollingUpdate dejaria dos pods compitiendo por el volumen (U4-T07, C-70).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: go-run-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-run-controller
        aqs.io/tier: control-plane
    spec:
      serviceAccountName: go-run-controller
      securityContext:
        fsGroup: 65532
      containers:
        - name: go-run-controller
          # TZ=UTC: variable inocua; existe para que image no sea la primera clave y el grep de CA-7 (^\s+image:) cuente todos los contenedores. Ver bitacoras/U5-T04.md F-03.
          env:
            - name: TZ
              value: UTC
            - name: SSL_CERT_FILE
              value: /etc/aqs/minio-ca/ca.crt
            - name: RUN_PHASES
              value: real
            - name: RUN_TEST_NAMESPACE
              value: aqs-test
            - name: LISTEN_ADDR
              value: ":8080"
            - name: RUN_DATA_DIR
              value: /data
            - name: RUN_EVENTS_FILE
              value: /data/events.jsonl
            - name: RUN_OUTBOX_FILE
              value: /data/outbox.jsonl
            - name: RUN_MAX_PARALLEL_RUNNERS
              value: "3"
            - name: GOVERNANCE_URL
              value: http://go-governance.aqs-system.svc:8080
            - name: GOVERNANCE_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: go-governance-service-token
                  key: token
            - name: IDENTITY_URL
              value: http://go-identity.aqs-system.svc:8080
            - name: WARM_URL
              value: http://go-warm-manager.aqs-system.svc:8080
            - name: WARM_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: go-warm-manager-service-token
                  key: token
            - name: RESET_URL
              value: http://go-reset.aqs-system.svc:8080
            - name: RESET_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: go-reset-service-token
                  key: token
            - name: RUN_ARTIFACT_REF
              value: ghcr.io/ogaston/agentic-qa-swarm/target-app:0.0.0
            - name: REHEARSAL_IMAGE
              value: ghcr.io/ogaston/agentic-qa-swarm/rehearsal:0.0.0
            - name: REHEARSAL_TARGET_URL
              value: http://warm-app.aqs-test.svc
            - name: RUNNER_IMAGE
              value: ghcr.io/ogaston/agentic-qa-swarm/runner:0.0.0
            - name: EVIDENCE_ENDPOINT
              value: https://minio.aqs-system.svc:9000
            - name: EVIDENCE_BUCKET
              value: evidence
            - name: EVIDENCE_ACCESS_KEY_FILE
              value: /etc/aqs/evidence/access-key
            - name: EVIDENCE_SECRET_KEY_FILE
              value: /etc/aqs/evidence/secret-key
          image: ghcr.io/ogaston/agentic-qa-swarm/go-run-controller:0.0.0
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
            - name: evidence
              mountPath: /etc/aqs/evidence
              readOnly: true
            - name: minio-ca
              mountPath: /etc/aqs/minio-ca
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: go-run-controller-data
        - name: tmp
          emptyDir: {}
        - name: evidence
          secret:
            secretName: aqs-evidence-s3
            defaultMode: 0440
        - name: minio-ca
          secret:
            secretName: minio-tls
            defaultMode: 0444
            items:
              - key: ca.crt
                path: ca.crt
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: go-run-controller-data
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: go-run-controller
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
