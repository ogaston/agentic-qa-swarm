apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - statefulset.yaml
  - service.yaml
  - job-init.yaml
  - networkpolicy.yaml
configMapGenerator:
  - name: nats-init-script
    namespace: aqs-system
    files:
      - nats-init.sh
generatorOptions:
  disableNameSuffixHash: true
