# Job idempotente: crea el stream AQS_EVENTS si no existe (U8-T01). Los consumidores durables los crea
# cada servicio en U8-T02. Etiqueta de cliente: el Job también habla con NATS (ver networkpolicy.yaml).
apiVersion: batch/v1
kind: Job
metadata:
  name: nats-init
  namespace: aqs-system
  labels:
    app.kubernetes.io/name: nats-init
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats-init
        aqs.io/nats-client: "true"
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: init
          image: docker.io/natsio/nats-box:0.14.5@sha256:0784ab710aefaf6ef037ed797ee7dcde613c6ad208c4dbff1945fc7c1b5b5375
          # cwd en /tmp: con cwd «/» el CLI nats v0.1.5 falla al resolver «.» (stat .: permission denied) como uid 1000.
          workingDir: /tmp
          command: ["/bin/sh", "/scripts/nats-init.sh"]
          env:
            - name: NATS_URL
              value: nats://nats.aqs-system.svc:4222
            - name: HOME
              value: /tmp
            - name: XDG_CONFIG_HOME
              value: /tmp/config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: scripts
          configMap:
            name: nats-init-script
        - name: tmp
          emptyDir: {}
