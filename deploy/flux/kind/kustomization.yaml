apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Overlay para el clúster kind local (U7-T03).
# Sin observabilidad ni backups: kind no trae los CRDs de Flux ni de prometheus-operator, y el destino
# de backup es S3 externo. Los Secrets no van aquí: los crea scripts/kind/secrets.sh en el clúster.
#
# Desviación respecto a la tarea (ver bitacoras/U7-T03.md, «Decisión de diseño»): la tarea pide
# referenciar piezas sueltas de ../base (namespaces.yaml, control-plane.yaml, warm.yaml). Kustomize,
# con su cargador por defecto (LoadRestrictionsRootOnly), rechaza archivos fuera de la raíz del overlay,
# y los enlaces simbólicos tampoco pasan. Por eso se referencia ../base entero y se borran con parches
# `$patch: delete` los objetos de observability y backup, uno por uno, por grupo/versión/kind/nombre.
resources:
  - ../base
# U8-T05: fixtures del LLM falso de los agentes (nombres sin sufijo de hash: los referencian los parches).
configMapGenerator:
  - name: agents-fixtures-planner
    files:
      - agents/planner/target-app.json
    options:
      disableNameSuffixHash: true
  - name: agents-fixtures-reporter
    files:
      - fixtures.json=agents/reporter/fixtures.json
    options:
      disableNameSuffixHash: true
patches:
  # --- observability: fuera en kind ---
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: kube-prometheus-stack
    patch: |-
      $patch: delete
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: kube-prometheus-stack
  - target:
      group: helm.toolkit.fluxcd.io
      version: v2
      kind: HelmRelease
      name: loki
    patch: |-
      $patch: delete
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: loki
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
      name: grafana
    patch: |-
      $patch: delete
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: grafana
  - target:
      group: source.toolkit.fluxcd.io
      version: v1
      kind: HelmRepository
      name: prometheus-community
    patch: |-
      $patch: delete
      apiVersion: source.toolkit.fluxcd.io/v1
      kind: HelmRepository
      metadata:
        name: prometheus-community
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: aqs-control-plane
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: ServiceMonitor
      metadata:
        name: aqs-control-plane
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: aqs-rules
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: aqs-rules
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: aqs-security-rules
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: aqs-security-rules
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: aqs-u2-rules
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: aqs-u2-rules
  - target:
      version: v1
      kind: ConfigMap
      name: aqs-dashboard
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: aqs-dashboard
  - target:
      version: v1
      kind: ConfigMap
      name: aqs-dashboard-u1
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: aqs-dashboard-u1
  - target:
      version: v1
      kind: ConfigMap
      name: aqs-dashboard-u4
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: aqs-dashboard-u4
  - target:
      version: v1
      kind: Namespace
      name: aqs-observability
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: Namespace
      metadata:
        name: aqs-observability
  # --- backup: destino S3 externo, fuera en kind ---
  - target:
      group: batch
      version: v1
      kind: CronJob
      name: evidence-backup
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: evidence-backup
  - target:
      version: v1
      kind: ConfigMap
      name: evidence-backup-scripts
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: evidence-backup-scripts
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: PrometheusRule
      name: aqs-backup-rules
    patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PrometheusRule
      metadata:
        name: aqs-backup-rules
  - target:
      version: v1
      kind: ServiceAccount
      name: aqs-backup
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: ServiceAccount
      metadata:
        name: aqs-backup
  # --- reutilizados de deploy/flux/dev/kustomization.yaml ---
  - target:
      kind: Deployment
      labelSelector: aqs.io/tier=control-plane
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
  - target:
      kind: Deployment
      name: go-governance
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: go-governance
      spec:
        template:
          spec:
            containers:
              - name: go-governance
                env:
                  - name: GOVERNANCE_ENV
                    value: dev
  # El ConfigMap go-reset-baseline de relleno lo crea scripts/kind/secrets.sh (no está en el overlay,
  # para que apply -k no pise un baseline real aplicado a mano).
  # --- U8-T05: agentes en kind con LLM falso (sin clave ni LiteLLM). Nunca con *_ENV=prod. ---
  # Fixtures: planner = superficie de la app de referencia (target-app.json); reporter = prompt de la
  # evidencia sembrada de bug-ecom-01 (generado por scripts/kind/gen_agent_fixtures.py).
  # Los ConfigMaps generados no llevan namespace (el generador no lo admite): sin esto caerían en «default».
  - target:
      version: v1
      kind: ConfigMap
      name: agents-fixtures-planner
    patch: |-
      - op: add
        path: /metadata/namespace
        value: aqs-system
  - target:
      version: v1
      kind: ConfigMap
      name: agents-fixtures-reporter
    patch: |-
      - op: add
        path: /metadata/namespace
        value: aqs-system
  - target:
      kind: Deployment
      name: agent-planner
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: LLM_PROVIDER
            value: fake
          - name: PLANNER_ALLOW_FAKE
            value: "true"
          - name: U3_FAKE_SURFACES_DIR
            value: /etc/aqs/fixtures/surfaces
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: fixtures
          mountPath: /etc/aqs/fixtures/surfaces
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: fixtures
          configMap:
            name: agents-fixtures-planner
  - target:
      kind: Deployment
      name: agent-reporter
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env
        value:
          - name: LLM_PROVIDER
            value: fake
          - name: REPORTER_ALLOW_FAKE
            value: "1"
          - name: REPORTER_FAKE_FIXTURES
            value: /etc/aqs/fixtures/fixtures.json
          - name: REPORTER_EVIDENCE
            value: s3
          - name: EVIDENCE_BUCKET
            value: evidence
          - name: S3_ENDPOINT
            value: https://minio.aqs-system.svc:9000
          - name: S3_ACCESS_KEY_FILE
            value: /etc/aqs/evidence/access-key
          - name: S3_SECRET_KEY_FILE
            value: /etc/aqs/evidence/secret-key
          - name: S3_CA_FILE
            value: /etc/aqs/minio-ca/ca.crt
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: fixtures
          mountPath: /etc/aqs/fixtures
          readOnly: true
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: fixtures
          configMap:
            name: agents-fixtures-reporter
# U8-T04: en kind el warm arranca con la app de referencia (demo/target-app), que sirve el baseline real en :9090.
# nginx (base) no tiene ese listener: sin esto, el warm no puede resetearse de dirty a ready en un clúster nuevo.
images:
  - name: nginx
    newName: ghcr.io/ogaston/agentic-qa-swarm/target-app
    newTag: "0.0.0"
