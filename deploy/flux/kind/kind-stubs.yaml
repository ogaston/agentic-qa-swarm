# Relleno de kind (U7-T03, E-2). NO es el baseline real de la aplicación: lo aporta un humano en
# producción y dev (control-plane.yaml, cabecera). Este stub solo deja arrancar go-reset y los CronJobs
# en el clúster local. Contrato: clean|verify|version. Etiqueta aqs.io/kind-stub=true para identificarlo.
apiVersion: v1
kind: ConfigMap
metadata:
  name: go-reset-baseline
  namespace: aqs-system
  labels:
    aqs.io/kind-stub: "true"
data:
  baseline.sh: |
    #!/bin/sh
    # Stub de kind (no hace nada). Contrato: clean | verify | version.
    case "${1:-}" in
      version) echo "v1" ;;
      clean|verify) echo "stub kind: $1 sin efecto" ;;
      *) echo "uso: baseline.sh clean|verify|version" >&2; exit 2 ;;
    esac
