apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: aqs-dev
  namespace: flux-system
spec:
  interval: 10m
  path: ./deploy/flux/dev
  prune: true
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  sourceRef:
    kind: GitRepository
    name: agentic-qa-swarm
