apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - secrets
patches:
  - target:
      kind: Deployment
      labelSelector: aqs.io/tier=control-plane
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
  - target:
      kind: Deployment
      name: go-governance
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: go-governance
      spec:
        template:
          spec:
            containers:
              - name: go-governance
                env:
                  - name: GOVERNANCE_ENV
                    value: dev
