apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../base
  - flux-kustomization.yaml
patches:
  - target:
      kind: Deployment
      labelSelector: aqs.io/tier=control-plane
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 128Mi
