[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-eval"
version = "0.0.1"
description = "Evaluacion offline de agent-planner y agent-reporter contra el dataset (U3-T05). Pipeline con FakeLLM, no calidad de modelo."
requires-python = ">=3.12"
dependencies = ["jsonschema==4.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# -vv a proposito: los criterios de U3 usan "-q -v | grep PASSED"; -q y -v se cancelan
# a verbosidad 0, pero con -vv de base "-q -v" suma 2 y lista los nombres de prueba.
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-vv"
