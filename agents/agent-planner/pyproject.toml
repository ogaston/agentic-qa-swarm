[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-planner"
version = "0.0.1"
description = "agent-planner: superficie a FlowPlan con limite duro y superficie como dato (U3-T02)."
requires-python = ">=3.12"
dependencies = ["jsonschema==4.23.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# -vv a proposito: los criterios de U3 usan "-q -v | grep PASSED"; -q y -v se cancelan
# a verbosidad 0, pero con -vv de base "-q -v" suma 2 y lista los nombres de prueba.
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "pbt_demo: demostracion de PBT (U3-T03)",
  "k6: requiere k6 (U3-T03)",
  "minio: requiere MinIO local (U3-T06)",
]
addopts = "-vv -m 'not pbt_demo and not k6 and not minio'"

[tool.setuptools.package-data]
agent_planner = ["schemas/*.json"]
